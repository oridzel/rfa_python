[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rfa-model"
version = "0.1.0"
description = "RFA electron trajectory, emission, cascade, and current accounting model"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "trimesh",
    "rtree",
    "joblib",
    "plotly",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rfa_model*"]
